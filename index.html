<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍳 AI Cooking</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            font-family: Arial;
        }

        .card {
            animation: fadeUp 0.4s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-orange-950 min-h-screen text-white">

    <div class="max-w-6xl mx-auto px-4 py-10">
        <!-- TITLE -->
        <h1 class="text-4xl font-bold mb-2">🍳 AI Gợi Ý Món Ăn</h1>
        <p class="text-slate-400 mb-6">Nhập nguyên liệu → AI gợi ý món ăn phù hợp</p>

        <!-- MODE -->
        <div class="flex justify-center gap-2 mb-4">
            <button id="mode-keyword" onclick="setMode('keyword')"
                class="px-4 py-2 rounded-lg bg-orange-500 text-white">Nguyên liệu</button>
            <button id="mode-natural" onclick="setMode('natural')" class="px-4 py-2 rounded-lg bg-slate-700">Câu tự
                nhiên</button>
        </div>

        <!-- INPUT -->
        <input id="ing" class="w-full p-4 rounded-xl text-black" placeholder="VD: cá cà chua hành..." />
        <div class="mt-3 text-sm text-slate-400 bg-slate-800 p-3 rounded-xl">
            <b>💡 Cách nhập để AI chính xác hơn:</b><br>
            • Gõ nguyên liệu: <i>cơm, trứng, bò, gà...</i><br>
            • Hoặc câu tự nhiên: <i>tôi có trứng và cơm</i><br>
            • Càng nhiều nguyên liệu → AI càng chính xác
        </div>
        <button onclick="go()" class="mt-4 bg-orange-500 px-6 py-3 rounded-xl font-bold hover:scale-105 transition">
            Gợi ý món ăn
        </button>

        <!-- QUICK -->
        <div id="dish-list" class="flex flex-wrap gap-2 text-sm"></div>
        <!-- RESULT -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">

            <!-- LEFT: LIST -->
            <div class="md:col-span-2">
                <div id="list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- RIGHT: DETAIL -->
            <div id="detail" class="bg-slate-800 rounded-xl p-4 h-fit sticky top-10">
                <p class="text-slate-400">Chọn món để xem chi tiết</p>
            </div>

        </div>
    </div>

    <script>

        let currentMode = "keyword";

        function setMode(mode) {
            currentMode = mode;

            document.getElementById("mode-keyword").className =
                mode === "keyword"
                    ? "px-4 py-2 rounded-lg bg-orange-500 text-white"
                    : "px-4 py-2 rounded-lg bg-slate-700";

            document.getElementById("mode-natural").className =
                mode === "natural"
                    ? "px-4 py-2 rounded-lg bg-orange-500 text-white"
                    : "px-4 py-2 rounded-lg bg-slate-700";
        }

        function setText(text) {
            document.getElementById("ing").value = text;
            go(); // 🔥 auto search luôn
        }

        function preprocessInput(text, mode) {
            text = text.toLowerCase().trim();

            if (mode === "keyword") {
                text = text
                    .replace(/tôi có|nguyên liệu|muốn nấu/g, "")
                    .replace(/,/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            return text;
        }

        async function go() {

            let ing = document.getElementById("ing").value;
            if (!ing.trim()) return;

            ing = preprocessInput(ing, currentMode);

            const list = document.getElementById("list");
            list.innerHTML = `<p class="text-slate-400">⏳ AI đang phân tích...</p>`;

            try {
                const res = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ingredients: ing })
                });

                const data = await res.json();

                if (!data.results) {
                    list.innerHTML = "❌ Không có kết quả";
                    return;
                }

                list.innerHTML = "";

                data.results.forEach((r, index) => {

                    const imgSrc = r.image && r.image !== "undefined"
                        ? r.image
                        : "/images/default.jpg";

                    const rankColor =
                        index === 0 ? "text-yellow-400" :
                            index === 1 ? "text-slate-300" :
                                "text-orange-300";

                    const card = document.createElement("div");
                    card.className = "card bg-slate-800 rounded-xl p-3 shadow-lg cursor-pointer hover:scale-[1.03] transition";

                    card.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold ${rankColor}">
                        #${index + 1}
                    </span>

                    <span class="text-xs text-slate-400">
                        match ${(r.match * 100).toFixed(0)}%
                    </span>
                </div>

                <img src="${imgSrc}" class="rounded-lg w-full h-40 object-cover"/>

                <h3 class="text-lg font-bold mt-2">${r.dish}</h3>

                <div class="w-full bg-slate-700 h-2 rounded mt-2">
                    <div class="bg-orange-500 h-2 rounded"
                        style="width:${Math.min(r.score * 40, 100)}%"></div>
                </div>

                <button class="mt-3 text-sm bg-orange-500 px-3 py-1 rounded-lg w-full"
                    onclick='fillInput("${r.slug}")'>
                    🔁 Dùng món này
                </button>
            `;

                    card.onclick = () => showDetail(r);

                    list.appendChild(card);
                });

            } catch (err) {
                list.innerHTML = "❌ Lỗi server";
            }
        }

        // =========================
        // DETAIL
        // =========================
        function showDetail(r) {

            document.getElementById("detail").innerHTML = `
        <img src="${r.image}" class="rounded-lg w-full h-48 object-cover"/>

        <h2 class="text-2xl font-bold mt-3">${r.dish}</h2>

        <div class="mt-3 text-sm text-slate-300">

            <p>🕒 ${r.cooking_time} phút</p>
            <p>📊 ${r.difficulty}</p>

            <h3 class="mt-3 font-bold">🥗 Nguyên liệu</h3>
            <ul class="list-disc ml-5">
                ${(r.ingredients || []).map(i =>
                `<li>${i.name}: ${i.amount}</li>`
            ).join("")}
            </ul>

            <h3 class="mt-3 font-bold">👨‍🍳 Cách làm</h3>
            <ol class="list-decimal ml-5">
                ${(r.steps || []).map(s =>
                `<li>${s}</li>`
            ).join("")}
            </ol>

        </div>
    `;
        }

        // =========================
        // AUTO FILL INPUT
        // =========================
        function fillInput(slug) {
            document.getElementById("ing").value = slug;
            go();
        }

    </script>
</body>

</html>
